# All texts shown to athletes, grouped by page. Templates read them with ${layout.msg("key")}.
#
# To add a language, copy this file to messages_<language>.properties (for example messages_pl.properties)
# and translate the values. The language is picked from the browser's Accept-Language header.
#
# Texts with {0} placeholders go through java.text.MessageFormat: write '' there for an apostrophe.

# ---- Shared ------------------------------------------------------------------------------------------------
app.name=QR Timing
header.racetime=RaceTime
header.what-is-this=What is this?
footer.service=Check-in service for RaceTime events.
footer.landing=QR Timing is a RaceTime service and cannot be used on its own.

checkpoint.finish=Finish
checkpoint.numbered=Checkpoint {0}
checkpoint.unnamed=Checkpoint

# ---- Landing page (landing.ftlh) ---------------------------------------------------------------------------
landing.title=QR Timing for RaceTime
landing.description=Self check-in for RaceTime events. Scan the QR code at a checkpoint, enter your bib number, and your time is recorded.
landing.badge=Self check-in for RaceTime events
landing.headline=Check in at the checkpoint with your phone.
landing.lead=QR Timing lets athletes record their own time. Scan the code at a checkpoint or at the finish, enter your bib number, and you are done.
landing.illustration=Illustration of a QR code
landing.notice.lead=Works with RaceTime only.
landing.notice.text=This service has no events, accounts or results of its own. It records check-ins for events organised in RaceTime, so without a QR code from a checkpoint there is nothing to do here.
landing.how.title=How it works
landing.how.scan.title=Scan the QR code
landing.how.scan.text=Find the code at a checkpoint or at the finish and scan it with your phone camera.
landing.how.enter.title=Enter your bib number
landing.how.enter.text=Type your bib number on the page that opens, and your PIN if you have one.
landing.how.timed.title=You are timed
landing.how.timed.text=Your time goes straight to RaceTime and a confirmation appears on screen.
landing.organisers.eyebrow=For organisers
landing.organisers.title=No staff needed at every checkpoint.
landing.organisers.text=Enable QR timing for your event in RaceTime and place the code at a checkpoint or the finish. Check-ins arrive in RaceTime next to your manual timing.
landing.organisers.button=Open RaceTime

# ---- Check-in page (check-in.ftlh) -------------------------------------------------------------------------
checkin.title=QR Timing check-in
checkin.event=Event
checkin.place.named=Checkpoint
checkin.place.numbered=You are at
checkin.place.finish=You are at the
checkin.bib.label=Bib number
checkin.bib.hint=The number on your race bib.
checkin.pin.label=PIN
checkin.pin.hint=Leave empty if you were not given a PIN.
checkin.submit=Check in
checkin.note=Your time is recorded the moment you check in.

