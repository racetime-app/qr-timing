NotBlank.form.bib=Enter your bib number.
Pattern.form.bib=A bib number has digits only.
Size.form.bib=This bib number is too long.
Pattern.form.pin=A PIN has digits only.
Size.form.pin=This PIN is too long.

# ---- Success page (success.ftlh) ---------------------------------------------------------------------------
success.title=QR Timing check-in recorded
success.checkpoint.heading=You are checked in
success.checkpoint.text=Your time at this checkpoint is saved in RaceTime.
success.finish.heading=Finish recorded
success.finish.text=Your finish time is saved in RaceTime. Well done!
success.checkpoint-repeated.heading=You are already checked in
success.checkpoint-repeated.text=Your time at this checkpoint was saved earlier. Nothing has changed.
success.finish-repeated.heading=Finish already recorded
success.finish-repeated.text=Your finish time was saved earlier. Nothing has changed.
success.event=Event
success.checkpoint=Checkpoint
success.bib=Bib
success.time=Time recorded
success.note=You can close this page now. There is nothing else to do.

# ---- Error page (error.ftlh), one block per ErrorScreen ----------------------------------------------------
error.title=QR Timing check-in failed
error.try-again=Try again
error.still-stuck=Still stuck? Ask a race official for help.
error.what-to-do=What to do:
error.what-is-qr-timing=What is QR Timing?

error.pin-required.heading=Enter your PIN
error.pin-required.text=This bib number has a PIN. Enter it together with the bib number and try again.

error.pin-mismatch.heading=PIN does not match
error.pin-mismatch.text=We could not verify that PIN for this bib number. Check the digits and try again.

error.bib-not-found.heading=Bib number not found
error.bib-not-found.text=There is no athlete with that bib number in this event. Check the number on your bib and try again.

error.bib-ambiguous.heading=More than one athlete has this bib number
error.bib-ambiguous.text=We cannot tell which athlete you are. If you were given a PIN, enter it together with the bib number.

error.qr-outdated.heading=This QR code is out of date
error.qr-outdated.text=The link you opened is no longer valid. It may have been replaced or the checkpoint closed.
error.qr-outdated.advice=scan the QR code at the checkpoint again. If it still does not work, ask a race official.

error.checkpoint-skipped.heading=A checkpoint was missed
error.checkpoint-skipped.text=There is no check-in from you at one or more earlier checkpoints, so we cannot record this one.
error.checkpoint-skipped.advice=speak to a race official at this checkpoint. They can look at your result and decide how to proceed.

error.not-started.heading=Your start is not recorded
error.not-started.text=RaceTime has no start time for this bib number yet, so we cannot record a check-in.
error.not-started.advice=speak to a race official. They can record your start.

error.too-many-attempts.heading=Too many attempts
error.too-many-attempts.text=A wrong PIN was entered too many times for this bib number, so check-ins are paused for a while.
error.too-many-attempts.advice=wait a few minutes and try again. If you do not know your PIN, ask a race official.

error.unavailable.heading=RaceTime is not responding
error.unavailable.text=We could not reach RaceTime, so your check-in was not saved. Please try again in a moment.

error.not-found.heading=Page not found
error.not-found.text=There is nothing at this address. To check in, scan the QR code at the checkpoint.

error.generic.heading=Something went wrong
error.generic.text=Your check-in could not be completed. Please scan the QR code at the checkpoint again.
